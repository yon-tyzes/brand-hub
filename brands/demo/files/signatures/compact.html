<table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; font-size: 13px; line-height: 1.5; color: {{color.text}};">
  <tr>
    <td style="padding: 0 12px 0 0; vertical-align: middle; border-right: 2px solid {{color.accent}};"><img src="{{site}}/files/logos/pocket-comet-mark-full-color.png" width="40" height="40" alt="Pocket Comet Teapots" style="display: block;"></td>
    <td style="padding: 0 0 0 12px; vertical-align: middle;">
      <div><span style="font-weight: bold; color: {{color.accent}};">{{name}}</span>{{#job-title}} | {{job-title}}{{/job-title}}</div>
      <div><a href="{{href.email}}" style="color: {{color.text}};">{{email}}</a>{{#phone}} | <a href="{{href.phone}}" style="color: {{color.text}};">{{phone}}</a>{{/phone}}</div>
    </td>
  </tr>
</table>
