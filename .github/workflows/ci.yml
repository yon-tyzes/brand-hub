name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check (schemas, brand data, copy, types)
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Structure (no short label above a heading in the built pages)
        run: node scripts/check-structure.mjs

      - name: Install browser for end-to-end tests
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end (axe in both themes, widths, keyboard flow, JS budget)
        run: pnpm test:e2e

      - name: Local adapter (astro dev on a temporary copy, writes and git history)
        run: pnpm test:local
